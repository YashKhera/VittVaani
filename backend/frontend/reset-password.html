<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Reset Password - VittVanni</title>
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('vittvanni:theme'));
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/accessibility.css">
  <link rel="stylesheet" href="/css/print.css">
  <style>
    .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-5) var(--space-4); }
    .auth-card { width: 100%; max-width: 440px; }
    .auth-brand { display: block; text-align: center; font-size: var(--font-size-lg); font-weight: 700; margin-bottom: var(--space-4); color: var(--text-primary); }
    .auth-brand:hover { text-decoration: none; }
    .auth-header { text-align: center; margin-bottom: var(--space-5); }
    .step-dots { display: flex; justify-content: center; gap: var(--space-2); margin-bottom: var(--space-4); }
    .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-border); transition: background 0.2s ease; }
    .step-dot.active { background: var(--color-primary); }
    .otp-input { letter-spacing: 8px; text-align: center; font-size: var(--font-size-lg); }
  </style>
</head>
<body data-page="reset-password">
  <div class="auth-container">
    <div class="auth-card">
      <a href="/home" class="auth-brand"><span class="gradient-text" data-i18n="app.name">VittVanni</span></a>
      <div class="card fade-in-up">
        <div class="auth-header">
          <h2 class="mb-1" id="stepTitle" data-i18n="auth.forgot.title">Forgot your password?</h2>
          <p class="text-muted mb-0 auth-sub" id="stepSub" data-i18n="auth.forgot.sub">Enter your registered email and we'll send a code to verify it's you</p>
        </div>

        <div class="step-dots" id="stepDots">
          <span class="step-dot active" data-step="1"></span>
          <span class="step-dot" data-step="2"></span>
          <span class="step-dot" data-step="3"></span>
        </div>

        <div id="formError" class="form-error hidden"></div>
        <div id="formNote" class="form-note hidden"></div>

        <form id="emailStep" novalidate>
          <div class="form-group">
            <label for="email" data-i18n="auth.email">Email address</label>
            <input type="email" id="email" name="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block mb-3" data-i18n="auth.otp.sendBtn">Send code</button>
          <a href="/login" class="btn btn-ghost btn-block text-center" data-i18n="auth.reset.backLogin">Back to Login</a>
        </form>

        <form id="otpStep" class="hidden" novalidate>
          <div class="form-group">
            <label for="otp" data-i18n="auth.otp.label">Enter the 6-digit code</label>
            <input type="text" id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" class="otp-input" placeholder="••••••" required>
            <p class="form-hint mt-2" id="otpHint" data-i18n="auth.otp.sent">We sent a 6-digit code to your registered email and mobile number</p>
          </div>
          <button type="submit" class="btn btn-primary btn-block mb-3" data-i18n="auth.otp.verifyBtn">Verify code</button>
          <div class="flex items-center justify-between mb-3">
            <a href="#" id="backToEmail" class="text-sm" data-i18n="auth.otp.backEmail">Change email</a>
            <a href="#" id="resendOtp" class="text-sm" data-i18n="auth.otp.resend">Resend code</a>
          </div>
        </form>

        <form id="resetPasswordForm" class="hidden" novalidate>
          <input type="hidden" id="resetToken" name="resetToken">
          <div class="form-group">
            <label for="newPassword" data-i18n="auth.reset.newPw">New Password</label>
            <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" placeholder="At least 8 characters with a number" required>
          </div>
          <div class="form-group">
            <label for="confirmNewPassword" data-i18n="auth.reset.confirmPw">Confirm New Password</label>
            <input type="password" id="confirmNewPassword" name="confirmNewPassword" autocomplete="new-password" placeholder="Re-enter your new password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block mb-3" data-i18n="auth.reset.btn">Reset Password</button>
          <a href="/login" class="btn btn-ghost btn-block text-center" data-i18n="auth.reset.backLogin">Back to Login</a>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/services/storage.js"></script>
  <script src="/js/services/theme.js"></script>
  <script src="/js/i18n/translations.js"></script>
  <script src="/js/services/i18n.js"></script>
  <script src="/js/services/notifications.js"></script>
  <script src="/js/services/validation.js"></script>
  <script src="/js/data/questions.js"></script>
  <script src="/js/data/schemes.js"></script>
  <script src="/js/services/matching.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/footer.js"></script>
  <script src="/js/components/progress-ring.js"></script>
  <script src="/js/components/scheme-card.js"></script>
  <script src="/js/components/match-badge.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/pages/reset-password.js"></script>

</body>
</html>
