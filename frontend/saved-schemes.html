<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Saved Schemes - VittVaani</title>
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('vittvaani:theme'));
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/print.css">
  <style>
    .saved-page { max-width: 860px; margin: 0 auto; }
    .saved-summary { text-align: center; margin-bottom: var(--space-5); color: var(--text-secondary); }
    .saved-summary strong { color: var(--text-primary); }
  </style>
</head>
<body data-page="saved-schemes">
  <a href="#savedGrid" class="skip-link">Skip to saved schemes</a>
  <header id="navbar" class="navbar"></header>

  <main class="container saved-page">
    <div class="results-header">
      <h1 class="mb-2" data-i18n="saved.title">Saved schemes</h1>
      <p class="text-muted" data-i18n="saved.empty.text">Save schemes while browsing to review them here later.</p>
    </div>

    <div class="saved-summary">
      <span id="savedCountLabel">0</span> <span id="savedCountUnit"></span>
    </div>

    <div id="savedGrid" class="grid-auto gap-4"></div>

    <div id="emptyState" class="hidden" style="text-align:center; padding: var(--space-7) 0;">
      <h2 data-i18n="saved.empty.title">Nothing saved yet</h2>
      <p class="text-muted" data-i18n="saved.empty.text">Save schemes while browsing to review them here later.</p>
      <a href="/find-schemes" class="btn btn-primary mt-4" data-i18n="questionnaire.start">Start</a>
    </div>
  </main>

  <div id="siteFooter"></div>

  <script src="js/services/storage.js"></script>
  <script src="js/services/theme.js"></script>
  <script src="js/i18n/translations.js"></script>
  <script src="js/services/i18n.js"></script>
  <script src="js/services/notifications.js"></script>
  <script src="js/services/validation.js"></script>
  <script src="js/data/questions.js"></script>
  <script src="js/data/schemes.js"></script>
  <script src="js/services/matching.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/components/progress-ring.js"></script>
  <script src="js/components/scheme-card.js"></script>
  <script src="js/components/match-badge.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/pages/saved-schemes.js"></script>

</body>
</html>
